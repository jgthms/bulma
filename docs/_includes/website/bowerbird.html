  <a class="bowerbird-body" href="https://bowerbird.gallery/" target="_blank">
    <div class="bowerbird-content is-hidden-desktop">
      <img
        src="{{site.url}}/assets/images/bowerbird/logo-mobile.png"
        height="68"
        width="240"
      />
      <img
        src="{{site.url}}/assets/images/bowerbird/text-mobile.png"
        height="99"
        width="228"
      />
      <div class="shine">
        <span>Get started for Free</span>
      </div>
    </div>

    <div class="bowerbird-content is-hidden-touch">
      <img
        src="{{site.url}}/assets/images/bowerbird/logo-desktop.png"
        height="50"
        width="140"
      />
      <img
        src="{{site.url}}/assets/images/bowerbird/text-desktop.png"
        height="58"
        width="571"
      />
      <div class="shine">
        <span>Get started for Free</span>
      </div>
    </div>

  <button
    id="bowerbird-close"
    class="modal-close is-large"
    aria-label="close"
  ></button>
</div>
